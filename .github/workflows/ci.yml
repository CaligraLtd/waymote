name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - uses: actions/setup-go@v6
        with:
          go-version: 1.26.5
          cache-dependency-path: gateway/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwayland-dev libxkbcommon-dev pkg-config
      - name: Test native daemon and gateway
        run: zig build test -Doptimize=ReleaseSafe
      - name: Validate browser SDK
        run: |
          node --check gateway/sdk/waymote.js
          node --check gateway/sdk/audio-player.js
          node --input-type=module --check < gateway/examples/web/client.js
          npx --yes --package typescript@5.7.3 tsc \
            --noEmit --skipLibCheck false --lib ES2022,DOM gateway/sdk/waymote.d.ts
          npm pack --dry-run ./gateway/sdk
